# ----------------------------------------------------------------------------- synthetic market (tests/demos only)
synthetic:
  seed: 1234
  start: "2026-09-01T00:00:00Z"
  duration_hours: 24.0
  launches_per_hour: 30.0
  n_creators: 250
  creator_mix: {rugger: 0.25, legit: 0.15, neutral: 0.60}
  n_wallets: 2500
  wallet_mix: {sniper: 0.01, smart: 0.01, whale: 0.006, bot: 0.04, insider: 0.03, retail: 0.904}
  max_token_life_s: 5400.0
  base_trade_rate_hz: 0.7
  activity_floor: 0.03               # flow intensity = base_rate * (floor + scale * quality^exponent) * exp(-age / life)
  activity_scale: 3.5
  activity_exponent: 4.0
  excitation: 0.3
  excitation_decay_s: 8.0
  dev_buy_sol: [0.2, 3.0]
  retail_trade_sol: [0.3, 0.9]      # lognormal [median SOL, sigma]
  whale_trade_sol: [4.0, 0.5]
  sniper_trade_sol: [0.5, 0.5]
  smart_trade_sol: [0.7, 0.5]
  sol_usd_start: 150.0
  sol_usd_vol_daily: 0.04
  amm_life_s: 1800.0
  life_scale_s: 420.0
  social_prob: {legit: 0.9, neutral: 0.55, rugger: 0.3}
  rug_prob: {rugger: 0.85, neutral: 0.12, legit: 0.03}
  rug_delay_s: [20.0, 400.0]
  smart_signal_noise: 0.25
  smart_entry_threshold: 0.8        # smart wallets are selective: they buy when noisy quality > threshold
  sniper_participation: 0.3
  sniper_slot0_frac: 0.7            # share of snipers landing in the creation slot (Jito bundles); the rest within ~2.5 s
  whale_participation: 0.1          # per-whale probability (x quality) of buying a launch
  sell_pressure: 0.4
  frontrun_intensity: 0.5            # probability a competing bot reacts to a buy during a burst (scaled by excitation)
  copytrade_mean: 2.5                # Poisson mean of fast copy-trade bots (40-350 ms) piling in after each smart / whale buy
  quality_drift_s: 90.0              # e-folding time of the quality tilt in retail flow (how fast information is priced in)
  frontrun_trade_sol: [0.6, 0.6]
  viral_prob: 0.03                   # heavy tail: rare tokens that go viral (drives ~1-2 % graduation)
  viral_boost: 5.0

ml:
  model: logistic             # logistic | random_forest | xgboost | lightgbm | catboost
  target: rug                 # rug | fwd_return | migrate
  fwd_return_horizon_s: 300.0
  fwd_return_threshold: 0.2
  cv_folds: 5
  embargo_s: 1800.0
  shap_samples: 300
  permutation_repeats: 5
  params:
    logistic: {C: 1.0, max_iter: 2000}
    random_forest: {n_estimators: 300, max_depth: 6, min_samples_leaf: 20, n_jobs: -1}
    xgboost: {n_estimators: 300, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8}
    lightgbm: {n_estimators: 300, num_leaves: 15, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, verbose: -1}
    catboost: {iterations: 300, depth: 4, learning_rate: 0.05, verbose: 0}
